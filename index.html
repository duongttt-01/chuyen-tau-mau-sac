<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuyến tàu màu sắc</title>
<style>
:root{--ink:#26365a;--pink:#ff7ca8;--yellow:#ffd65a;--sky:#8bdcff;--green:#9ce6a8}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#a8e8ff,#e9faff 60%,#c9f4c8);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:12px 20px;font-weight:800;color:#fff;background:#ff7ca8;box-shadow:0 5px 0 #d85886;transition:.15s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 2px 0 #d85886}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap}.brand{font-size:clamp(20px,3vw,30px);font-weight:1000;color:#f05b91;text-shadow:2px 2px white}.controls{display:flex;gap:8px}.controls button{background:#5f9be8;box-shadow:0 4px 0 #3974be;padding:9px 14px}
main{max-width:1100px;margin:auto;padding:8px 16px 28px}.scene{position:relative;min-height:220px;border:5px solid white;border-radius:28px;background:linear-gradient(#8ee0ff,#e8fbff);overflow:hidden;box-shadow:0 9px 24px #5aa9c533;padding:18px}
.cloud{position:absolute;background:white;border-radius:50px;width:110px;height:34px;opacity:.8}.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}.cloud:before{width:48px;height:48px;left:15px;top:-20px}.cloud:after{width:36px;height:36px;right:18px;top:-13px}
.rainbow{position:absolute;right:4%;top:8px;font-size:70px;opacity:.45}.intro{position:relative;z-index:1;text-align:center;padding:24px 8px 15px}.intro h1{font-size:clamp(28px,5vw,54px);margin:8px 0;color:#ef5592;text-shadow:3px 3px white}.intro p{font-size:clamp(16px,2.5vw,22px);font-weight:700;margin:8px}.bunny{font-size:clamp(60px,9vw,100px);filter:drop-shadow(0 5px 2px #5577aa22);animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
#game{display:none}.mission{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0 16px;font-size:clamp(17px,2.5vw,23px);font-weight:900;text-align:center}.speech{background:#fff;border:3px solid #fff;border-radius:20px;padding:12px 18px;box-shadow:0 4px 0 #b8e6f3;max-width:700px}
.playfield{display:grid;grid-template-columns:1fr;gap:14px}.train-area{background:#fff9;border:3px dashed #fff;border-radius:24px;padding:12px}.label{text-align:center;font-weight:900;margin:0 0 8px;font-size:17px}.wagons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:120px;align-items:center}.wagon{width:clamp(130px,20vw,190px);min-height:105px;border-radius:20px 20px 14px 14px;border:4px solid #fff;box-shadow:0 6px 0 #0002;position:relative;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 8px 16px;gap:3px;color:#fff;font-weight:1000;text-shadow:0 1px 3px #0005;transition:.2s}.wagon:before{content:"";position:absolute;top:-17px;left:20px;width:55px;height:22px;background:inherit;border:3px solid white;border-radius:12px 12px 0 0}.wagon:after{content:"●     ●";position:absolute;bottom:-18px;color:#33415d;font-size:23px;letter-spacing:18px;left:20px;text-shadow:none}.wagon .wname{width:100%;text-align:center;font-size:18px}.wagon .inside{font-size:28px;min-height:28px}.wagon.over{outline:5px solid #ffe66b;transform:scale(1.04)}.items-area{background:#ffffffb8;border-radius:24px;padding:14px;border:3px solid white}.items{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;min-height:130px}.item{width:clamp(85px,14vw,120px);height:clamp(85px,14vw,120px);background:#fff;border:3px solid #fff;border-radius:22px;box-shadow:0 6px 0 #b7d9e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;user-select:none;cursor:grab;transition:transform .12s}.item:active{cursor:grabbing}.item.dragging{opacity:.55;transform:scale(1.08)}.emoji{font-size:clamp(34px,6vw,55px);line-height:1.1}.iname{font-size:13px;font-weight:900;text-align:center}.progress{display:flex;justify-content:center;gap:7px;margin:12px}.dot{width:13px;height:13px;border-radius:50%;background:#ffffff8a;border:2px solid white}.dot.done{background:#ffd54f}.bottom{text-align:center;margin:15px}.bottom button{margin:5px}.secondary{background:#63b5df;box-shadow:0 5px 0 #3189b5}.modal{position:fixed;inset:0;background:#20335a88;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.card{background:white;border-radius:30px;padding:28px;text-align:center;max-width:560px;width:100%;box-shadow:0 15px 40px #20335a55}.card h2{font-size:clamp(28px,5vw,42px);color:#f05b91}.card .big{font-size:80px}.card p{font-size:20px;font-weight:800}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;padding:12px 22px;border-radius:20px;box-shadow:0 5px 20px #3455;display:none;font-weight:900;z-index:20}.toast.show{display:block;animation:pop .25s}@keyframes pop{from{transform:translateX(-50%) scale(.7)}to{transform:translateX(-50%) scale(1)}}
@media(min-width:800px){.playfield{grid-template-columns:1fr 1fr}.items-area{display:flex;flex-direction:column;justify-content:center}.scene{min-height:250px}}
</style>
</head>
<body>
<div class="top"><div class="brand">🚂 CHUYẾN TÀU MÀU SẮC</div><div class="controls"><button id="soundBtn" aria-label="Bật tắt âm thanh">🔊 Âm thanh</button><button id="repeatBtn">🔁 Nghe lại</button></div></div>
<main>
<section class="scene" id="welcome">
<div class="cloud" style="left:8%;top:45px"></div><div class="cloud" style="right:20%;top:75px"></div><div class="rainbow">🌈</div>
<div class="intro"><div class="bunny">🐰</div><h1>CHUYẾN TÀU MÀU SẮC</h1><p>Thỏ Trắng đang chờ bé giúp đưa đồ vật về đúng toa!</p><button id="startBtn" style="font-size:22px;padding:16px 28px">🚂 BÉ ƠI, LÊN TÀU NÀO!</button></div>
</section>
<section id="game">
<div class="mission"><div class="bunny" style="font-size:54px">🐰</div><div class="speech" id="speech">Bé hãy kéo đồ vật vào đúng toa tàu nhé!</div></div>
<div class="progress" id="progress"></div>
<div class="playfield">
<div class="train-area"><p class="label">🚃 TOA TÀU ĐANG CHỜ</p><div class="wagons" id="wagons"></div></div>
<div class="items-area"><p class="label">🎁 ĐỒ VẬT CỦA BÉ</p><div class="items" id="items"></div></div>
</div>
<div class="bottom"><button class="secondary" id="hintBtn">💡 Gợi ý</button><button id="nextBtn" style="display:none">➡️ Ga tiếp theo</button><button class="secondary" id="restartBtn">🔄 Chơi lại</button></div>
</section>
</main>
<div class="modal" id="modal"><div class="card"><div class="big" id="modalEmoji">🌟</div><h2 id="modalTitle">Giỏi quá!</h2><p id="modalText">Bé đã hoàn thành!</p><button id="modalBtn">Tiếp tục</button></div></div>
<div class="toast" id="toast">⭐ Chính xác rồi!</div>
<script>
const stages=[
 {name:'ĐỎ',color:'#ef5350',bg:'#ffb5b5',scene:'🌷 Khu vườn hoa đỏ',intro:'Toa tàu màu đỏ đang chờ đồ vật màu đỏ. Có vài món màu khác nữa, bé chọn thật tinh mắt nhé!',items:[['🔴','Quả bóng đỏ','red'],['🟡','Bóng vàng','yellow'],['🟥','Khối vuông đỏ','red'],['🔵','Bóng xanh dương','blue'],['❤️','Trái tim đỏ','red'],['🟢','Bóng xanh lá','green'],['🧧','Phong bao đỏ','red']]},
 {name:'VÀNG',color:'#f5bd19',bg:'#ffe89a',scene:'🌻 Cánh đồng nắng vàng',intro:'Bây giờ chúng mình tìm đồ vật màu vàng nhé. Món khác màu sẽ chưa được lên toa!',items:[['🟡','Quả bóng vàng','yellow'],['🔴','Bóng đỏ','red'],['🟨','Khối vuông vàng','yellow'],['🟦','Khối xanh dương','blue'],['🌟','Ngôi sao vàng','yellow'],['🟩','Khối xanh lá','green'],['💛','Trái tim vàng','yellow']]},
 {name:'XANH DƯƠNG',color:'#258bdc',bg:'#a9ddff',scene:'🐠 Đại dương xanh',intro:'Toa tàu xanh dương cần đồ vật cùng màu. Bé nhớ bỏ qua những món khác màu nhé!',items:[['🔵','Quả bóng xanh dương','blue'],['🟡','Bóng vàng','yellow'],['🟦','Khối vuông xanh dương','blue'],['❤️','Trái tim đỏ','red'],['💙','Trái tim xanh dương','blue'],['🟩','Khối xanh lá','green'],['🌀','Vòng xoáy xanh dương','blue']]},
 {name:'XANH LÁ',color:'#43ad58',bg:'#b7edb9',scene:'🌳 Khu rừng xanh',intro:'Chúng mình cùng tìm đồ vật màu xanh lá nhé. Chọn đúng màu mới hoàn thành!',items:[['🟢','Quả bóng xanh lá','green'],['🔴','Bóng đỏ','red'],['🟩','Khối vuông xanh lá','green'],['🟨','Khối vàng','yellow'],['💚','Trái tim xanh lá','green'],['🔵','Bóng xanh dương','blue'],['🌿','Lá xanh','green']]},
 {name:'CẦU VỒNG',color:null,bg:'#e6d7ff',scene:'🌈 Ga cầu vồng',intro:'Bé hãy đưa tất cả đồ vật về đúng toa màu sắc nhé!',items:[['🔴','Bóng đỏ','red'],['🟡','Bóng vàng','yellow'],['🔵','Bóng xanh dương','blue'],['🟢','Bóng xanh lá','green'],['🟥','Khối đỏ','red'],['🟨','Khối vàng','yellow'],['🟦','Khối xanh dương','blue'],['🟩','Khối xanh lá','green']]}
];
const colorMap={red:{name:'ĐỎ',hex:'#ef5350'},yellow:{name:'VÀNG',hex:'#f5bd19'},blue:{name:'XANH DƯƠNG',hex:'#258bdc'},green:{name:'XANH LÁ',hex:'#43ad58'}};
let stage=0,done=new Set(),sound=true,drag=null;
const $=id=>document.getElementById(id);
function speak(text){if(!sound)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=.9;u.pitch=1.15;let voices=speechSynthesis.getVoices();let v=voices.find(x=>x.lang.toLowerCase().startsWith('vi'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function beep(freq=700,dur=.12){if(!sound)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.start();g.stop(c.currentTime+dur);o.onended=()=>c.close()}catch(e){}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1200)}
function start(){stage=0;$('welcome').style.display='none';$('game').style.display='block';render();speak('Xin chào các bạn nhỏ! Tớ là Thỏ Trắng. Hôm nay chúng mình cùng khám phá thế giới màu sắc nhé. Lên tàu thôi nào!')}
function render(){done=new Set();let s=stages[stage];$('speech').textContent=s.intro;$('progress').innerHTML=stages.map((_,i)=>`<span class="dot ${i<stage?'done':''}" title="Màn ${i+1}"></span>`).join('');
$('wagons').innerHTML='';let colors=stage===4?['red','yellow','blue','green']:[Object.keys(colorMap)[stage]];
colors.forEach(c=>{let w=document.createElement('div');w.className='wagon';w.dataset.color=c;w.style.background=colorMap[c].hex;w.innerHTML=`<div class="wname">${colorMap[c].name}</div><div class="inside" id="inside-${c}"></div>`;w.addEventListener('pointerenter',()=>w.classList.add('over'));w.addEventListener('pointerleave',()=>w.classList.remove('over'));$('wagons').appendChild(w)});
$('items').innerHTML='';s.items.forEach((it,i)=>{let el=document.createElement('div');el.className='item';el.dataset.color=it[2];el.dataset.index=i;el.innerHTML=`<div class="emoji">${it[0]}</div><div class="iname">${it[1]}</div>`;el.addEventListener('pointerdown',pointerDown);$('items').appendChild(el)});
$('nextBtn').style.display='none';}
function pointerDown(e){if(done.has(+e.currentTarget.dataset.index))return;e.preventDefault();let el=e.currentTarget;drag={el,index:+el.dataset.index,color:el.dataset.color,startX:e.clientX,startY:e.clientY,clone:el.cloneNode(true)};drag.clone.classList.add('dragging');drag.clone.style.position='fixed';drag.clone.style.zIndex=1000;drag.clone.style.pointerEvents='none';drag.clone.style.width=el.offsetWidth+'px';drag.clone.style.left=(e.clientX-el.offsetWidth/2)+'px';drag.clone.style.top=(e.clientY-el.offsetHeight/2)+'px';document.body.appendChild(drag.clone);el.style.visibility='hidden';el.setPointerCapture?.(e.pointerId);window.addEventListener('pointermove',pointerMove);window.addEventListener('pointerup',pointerUp,{once:true});}
function pointerMove(e){if(!drag)return;drag.clone.style.left=(e.clientX-drag.el.offsetWidth/2)+'px';drag.clone.style.top=(e.clientY-drag.el.offsetHeight/2)+'px';document.querySelectorAll('.wagon').forEach(w=>{let r=w.getBoundingClientRect();w.classList.toggle('over',e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)})}
function pointerUp(e){window.removeEventListener('pointermove',pointerMove);if(!drag)return;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.wagon');let item=drag;item.clone.remove();drag=null;document.querySelectorAll('.wagon').forEach(w=>w.classList.remove('over'));
if(target&&target.dataset.color===item.color){done.add(item.index);item.el.remove();let inside=target.querySelector('.inside');inside.textContent+=(stages[stage].items[item.index][0]+' ');inside.style.fontSize='25px';beep(880,.16);toast('⭐ Chính xác rồi!');speak(['Chính xác rồi! Bé giỏi quá!','Hoan hô!','Đúng rồi! Tuyệt vời!'][Math.floor(Math.random()*3)]);if(done.size===targetCount())completeStage();}
else{item.el.style.visibility='visible';beep(260,.1);toast('Thử lại nhé bé!');speak('Mình thử lại nhé! Hãy tìm toa tàu cùng màu nào.');}}
function targetCount(){const s=stages[stage];return stage===4?s.items.length:s.items.filter(it=>it[2]===Object.keys(colorMap)[stage]).length;}
function completeStage(){beep(1000,.25);$('speech').textContent='🎉 Bé đã đưa tất cả đồ vật về đúng toa!';speak('Tuyệt vời! Bé đã hoàn thành màn chơi này!');$('nextBtn').style.display='inline-block';if(stage===4){setTimeout(()=>showWin(),700)}else{setTimeout(()=>{showModal('🎖️','Hoàn thành xuất sắc!','Bé nhận được một huy hiệu màu sắc!','Ga tiếp theo')},600)}}
function showModal(emoji,title,txt,btn){ $('modalEmoji').textContent=emoji;$('modalTitle').textContent=title;$('modalText').textContent=txt;$('modalBtn').textContent=btn;$('modal').classList.add('show');}
function showWin(){showModal('🏆','CHÚC MỪNG BÉ!','Bé đã hoàn thành Chuyến tàu màu sắc! Bé thật tinh mắt và giỏi giang!','Chơi lại');$('modalBtn').onclick=()=>{$('modal').classList.remove('show');stage=0;render();speak('Chúng mình chơi lại nhé!')};}
$('startBtn').onclick=start;$('nextBtn').onclick=()=>{stage=Math.min(stage+1,4);render();speak(stages[stage].intro)};$('restartBtn').onclick=()=>{stage=0;render();speak('Chúng mình bắt đầu lại nào!')};$('hintBtn').onclick=()=>{let item=stages[stage].items.find((_,i)=>!done.has(i));if(item){speak('Bé hãy tìm đồ vật màu '+colorMap[item[2]].name.toLowerCase()+' nhé!');toast('💡 Tìm màu '+colorMap[item[2]].name)}};
$('repeatBtn').onclick=()=>speak(stages[stage]?.intro||'Xin chào bé!');$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 Âm thanh':'🔇 Tắt âm';if(!sound)speechSynthesis.cancel();else speak('Âm thanh đã bật')};
$('modalBtn').onclick=()=>{$('modal').classList.remove('show');stage++;render();speak(stages[stage].intro)};
speechSynthesis?.getVoices?.();
</script>
</body></html>
